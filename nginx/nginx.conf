events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────
    # WebSocket upgrade map (REQUIRED)
    # ─────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─────────────────────────────────────
    # Basic settings
    # ─────────────────────────────────────
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────
    # Logging
    # ─────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ─────────────────────────────────────
    # Server block: api.dogehouse.me
    # ─────────────────────────────────────
    server {
        listen 80;
        server_name api.dogehouse.me;

        # ─── WebSocket endpoint ───
        location /socket {
            proxy_pass http://kousa:4001;
            proxy_http_version 1.1;

            # WebSocket headers (critical)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cloudflare: preserve real visitor IP
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            # Timeouts for long-lived WebSocket/voice connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            # Buffering off for WebSocket
            proxy_buffering off;
        }

        # ─── API / all other paths ───
        location / {
            proxy_pass http://kousa:4001;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ─── Health check (for uptime monitors) ───
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ─── Block unwanted access ───
        # Deny .git, .env, etc.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
