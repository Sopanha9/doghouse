version: "3"
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kousa
      - shawarma
    restart: always

  shawarma:
    build: ./shawarma
    network_mode: "host"
    env_file:
      - shawarma.env
    restart: always

  kousa:
    build: ./kousa
    env_file:
      - kousa.env
    expose:
      - "4001"
    depends_on:
      - postgres
      - rabbitmq
    restart: always

  postgres:
    image: postgres:13
    env_file:
      - pg.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - rabbit.env
    ports:
      - "5672:5672"
    restart: always

  adminer:
    image: adminer
    expose:
      - "8080"
    restart: always

volumes:
  postgres_data:
